[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.121.0",
    "common",
    "fastapi",
    "uvicorn[standard]",
]

[project.scripts]
serve = "api.main:run"

[tool.uv.sources]
common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
